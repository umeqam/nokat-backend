<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NOKAT</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --white: #ffffff;
  --surface: #faf9f7;
  --border: #e8e5e0;
  --text: #18181a;
  --muted: #8a8a8a;
  --accent: #1a1a1a;
  --green: #00c86f;
  --yellow: #f5c842;
  --blue: #3b82f6;
  --red: #ef4444;
  --master: #c8ff00;
  --font-display: 'Unbounded', sans-serif;
  --font-body: 'Noto Sans', sans-serif;
  --radius: 20px;
  --radius-sm: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
}
.screen { display:none; flex-direction:column; height:100vh; }
.screen.active { display:flex; }

/* HOME */
.home-header { padding: 56px 24px 20px; background: var(--text); border-radius: 0 0 32px 32px; }
.home-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.home-logo { font-family: var(--font-display); font-size: 22px; font-weight: 900; color: white; letter-spacing: -0.02em; }
.home-logo span { color: var(--master); }
.home-avatar { font-size: 24px; cursor: pointer; }
.home-greeting { color: white; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.home-question { color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 20px; }

.mode-pills { display: flex; gap: 8px; margin-bottom: 0; }
.mode-pill { flex: 1; padding: 12px; border-radius: 14px; border: none; cursor: pointer; font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.2s; }
.mode-pill.inactive { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
.mode-pill.active { background: var(--master); color: var(--text); }

.home-body { flex:1; overflow-y:auto; padding:20px 20px 90px; }

.person-card { background: var(--white); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); margin-bottom: 12px; }
.person-card:active { transform: scale(0.98); }

.pc-row1 { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
.pc-avatar { width: 52px; height: 52px; border-radius: 14px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.pc-info { flex: 1; }
.pc-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.pc-cat { color: var(--muted); font-size: 13px; }
.pc-desc { color: var(--text); font-size: 14px; line-height: 1.4; margin: 8px 0; }

.trust-badge { padding: 5px 10px; border-radius: 100px; font-size: 10px; font-weight: 700; font-family: var(--font-display); }
.tb-new { background: #e0e0e0; color: #333; }
.tb-reliable { background: #d4f4dd; color: #2d5a3d; }
.tb-verified { background: #fff4c8; color: #8b6f00; }
.tb-master { background: #f0ffe0; color: #3a7d00; border: 1px solid #c8ff00; }

.pc-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
.pc-meta { color: var(--muted); font-size: 13px; }
.btn-contact { background: var(--text); color: white; border: none; border-radius: 12px; padding: 10px 16px; font-family: var(--font-display); font-size: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; }

.loading { text-align: center; padding: 40px 20px; color: var(--muted); }
.error { background: #ffe0e0; color: #8b0000; padding: 12px; border-radius: 12px; margin-bottom: 12px; }

/* REQUEST SCREEN */
.req-header { padding: 56px 20px 20px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
.req-back { cursor: pointer; font-size: 24px; }
.req-title { font-family: var(--font-display); font-size: 18px; font-weight: 800; flex: 1; }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
.form-input, .form-textarea, .form-select { 
  width: 100%; 
  padding: 12px; 
  border-radius: 14px; 
  border: 1px solid var(--border); 
  font-size: 15px; 
  font-family: var(--font-body);
}
.form-textarea { min-height: 120px; resize: vertical; }

.btn-primary { 
  width: 100%; 
  padding: 18px; 
  background: var(--text); 
  color: white; 
  border: none; 
  border-radius: 14px; 
  font-weight: 700; 
  font-family: var(--font-display);
  cursor: pointer;
  font-size: 14px;
}
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: var(--white); border-top: 1px solid var(--border); padding: 12px 20px 24px; display: flex; justify-content: space-around; z-index: 100; }
.bn-item { cursor: pointer; text-align: center; flex: 1; }
.bn-item.active { opacity: 1; }
.bn-item:not(.active) { opacity: 0.5; }
.bn-icon { font-size: 20px; margin-bottom: 4px; }
.bn-label { font-size: 11px; font-weight: 600; }

</style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <div class="home-top">
      <div class="home-logo">NOK<span>A</span>T</div>
      <div class="home-avatar">👤</div>
    </div>
    <div class="home-greeting">Привет, Ахметяр 👋</div>
    <div class="home-question">Что тебе нужно сегодня?</div>

    <div class="mode-pills">
      <button class="mode-pill active" onclick="setMode('ищу')">🔍 Я ищу</button>
      <button class="mode-pill inactive" onclick="setMode('предлагаю')">⚡ Я предлагаю</button>
    </div>
  </div>

  <div class="home-body">
    <div id="home-error" class="error" style="display:none;"></div>
    <div class="loading" id="home-loading">⏳ Загружаю посты...</div>
    <div class="cards-list" id="home-cards"></div>
  </div>

  <div class="bottom-nav">
    <div class="bn-item active"><div class="bn-icon">🏠</div><div class="bn-label">Главная</div></div>
    <div class="bn-item" onclick="goTo('screen-request')"><div class="bn-icon">+</div><div class="bn-label">Создать</div></div>
  </div>
</div>

<!-- NEW REQUEST -->
<div id="screen-request" class="screen">
  <div class="req-header">
    <div class="req-back" onclick="goBack()">←</div>
    <div class="req-title">Новый запрос</div>
  </div>

  <div style="flex:1; overflow-y:auto; padding:20px 20px 100px;">
    <div class="form-group">
      <label class="form-label">Тип запроса</label>
      <select id="new-mode" class="form-select">
        <option value="ищу">🔍 Я ищу</option>
        <option value="предлагаю">⚡ Я предлагаю</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Заголовок</label>
      <input id="new-title" class="form-input" placeholder="Краткое описание (5-200 символов)" maxlength="200">
    </div>

    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea id="new-description" class="form-textarea" placeholder="Подробнее об этом (минимум 10 символов)"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Категория</label>
      <input id="new-category" class="form-input" placeholder="Услуги, Товары, Работа, etc." value="Разное">
    </div>

    <div class="form-group">
      <label class="form-label">Регион</label>
      <input id="new-region" class="form-input" placeholder="Ашгабат, Туркменабат, Онлайн" value="Ашгабат">
    </div>

    <div class="form-group">
      <label class="form-label">Бюджет (опционально)</label>
      <input id="new-budget" class="form-input" type="number" placeholder="0" min="0">
    </div>
  </div>

  <div style="padding:16px 20px 32px; background:var(--white); border-top:1px solid var(--border); position:fixed; bottom:0; left:0; right:0; max-width:430px; margin:0 auto;">
    <button id="btn-publish" class="btn-primary" onclick="createPost()">Опубликовать</button>
  </div>
</div>

<script>
// ==================== CONFIG ====================
// Используй это для разных окружений
const CONFIG = {
  API_BASE: window.location.hostname === 'localhost' 
    ? 'http://localhost:8000/api/v1'
    : 'https://nokat.pro/api/v1'
};

console.log('API Base:', CONFIG.API_BASE);

// Текущий пользователь (позже из localStorage или auth)
let CURRENT_USER_ID = 1;
let CURRENT_MODE = 'ищу';

// ==================== API HELPERS ====================
async function apiCall(endpoint, options = {}) {
  try {
    const url = CONFIG.API_BASE + endpoint;
    const response = await fetch(url, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...options.headers
      }
    });
    
    if (!response.ok) {
      const error = await response.json().catch(() => ({ detail: 'Unknown error' }));
      throw new Error(error.detail || `HTTP ${response.status}`);
    }
    
    return await response.json();
  } catch (error) {
    console.error('API Error:', error);
    throw error;
  }
}

// ==================== LOAD & RENDER ====================
async function loadPosts() {
  const loader = document.getElementById('home-loading');
  const errorDiv = document.getElementById('home-error');
  const container = document.getElementById('home-cards');
  
  try {
    errorDiv.style.display = 'none';
    loader.style.display = 'block';
    container.innerHTML = '';
    
    const posts = await apiCall(`/posts?mode=${CURRENT_MODE}&limit=20`);
    
    loader.style.display = 'none';
    renderPosts(posts);
  } catch (error) {
    loader.style.display = 'none';
    errorDiv.style.display = 'block';
    errorDiv.textContent = '⚠️ Ошибка загрузки: ' + error.message;
    console.error(error);
  }
}

function renderPosts(posts) {
  const container = document.getElementById('home-cards');
  
  if (!posts || posts.length === 0) {
    container.innerHTML = '<div class="loading">📭 Нет постов</div>';
    return;
  }
  
  container.innerHTML = posts.map(p => {
    const trustColor = 
      p.author?.trust_level === 'МАСТЕР' ? 'tb-master' :
      p.author?.trust_level === 'ПРОВЕРЕННЫЙ' ? 'tb-verified' :
      p.author?.trust_level === 'НАДЁЖНЫЙ' ? 'tb-reliable' :
      'tb-new';
    
    return `
      <div class="person-card">
        <div class="pc-row1">
          <div class="pc-avatar">${p.mode === 'ищу' ? '🔍' : '⚡'}</div>
          <div class="pc-info">
            <div class="pc-name">${p.author?.display_name || 'Аноним'}</div>
            <div class="pc-cat">${p.category}</div>
          </div>
          <div class="trust-badge ${trustColor}">★ ${p.author?.trust_level || 'НОВИЧОК'}</div>
        </div>
        
        <div class="pc-desc"><strong>${p.title}</strong></div>
        <div class="pc-desc">${p.description.substring(0, 100)}...</div>
        
        <div class="pc-footer">
          <span class="pc-meta">📍 ${p.region}${p.budget ? ' • ' + p.budget + ' м' : ''}</span>
          <button onclick="respondToPost(${p.id})" class="btn-contact">Откликнуться</button>
        </div>
      </div>
    `;
  }).join('');
}

// ==================== CREATE POST ====================
async function createPost() {
  const title = document.getElementById('new-title').value.trim();
  const description = document.getElementById('new-description').value.trim();
  const mode = document.getElementById('new-mode').value;
  const category = document.getElementById('new-category').value || 'Разное';
  const region = document.getElementById('new-region').value || 'Ашгабат';
  const budget = parseFloat(document.getElementById('new-budget').value) || null;
  
  // Валидация
  if (!title || title.length < 5) {
    alert('Заголовок минимум 5 символов');
    return;
  }
  if (!description || description.length < 10) {
    alert('Описание минимум 10 символов');
    return;
  }
  
  const btn = document.getElementById('btn-publish');
  btn.disabled = true;
  btn.textContent = 'Опубликовываю...';
  
  try {
    const newPost = await apiCall('/posts', {
      method: 'POST',
      body: JSON.stringify({
        user_id: CURRENT_USER_ID,
        mode,
        title,
        description,
        category,
        region,
        budget
      })
    });
    
    alert('✅ Пост опубликован!');
    
    // Очистить форму
    document.getElementById('new-title').value = '';
    document.getElementById('new-description').value = '';
    document.getElementById('new-budget').value = '';
    
    // Вернуться на главную
    goTo('screen-home');
    await loadPosts();
  } catch (error) {
    alert('❌ Ошибка: ' + error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Опубликовать';
  }
}

// ==================== RESPOND ====================
async function respondToPost(postId) {
  const message = prompt('Твой отклик (опционально):');
  if (message === null) return; // Отмена
  
  try {
    await apiCall(`/posts/${postId}/respond`, {
      method: 'POST',
      body: JSON.stringify({
        responder_id: CURRENT_USER_ID,
        message: message || ''
      })
    });
    
    alert('✅ Отклик отправлен!');
    await loadPosts();
  } catch (error) {
    alert('❌ Ошибка: ' + error.message);
  }
}

// ==================== NAVIGATION ====================
function setMode(mode) {
  CURRENT_MODE = mode;
  
  // Обновить активные кнопки
  document.querySelectorAll('.mode-pill').forEach(btn => {
    btn.classList.remove('active', 'inactive');
    if (btn.textContent.includes(mode === 'ищу' ? '🔍' : '⚡')) {
      btn.classList.add('active');
    } else {
      btn.classList.add('inactive');
    }
  });
  
  loadPosts();
}

function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screen).classList.add('active');
  
  // Обновить bottom nav
  const isHome = screen === 'screen-home';
  document.querySelectorAll('.bn-item').forEach((item, i) => {
    item.classList.toggle('active', (i === 0 && isHome) || (i === 1 && !isHome));
  });
}

function goBack() {
  goTo('screen-home');
}

// ==================== INIT ====================
window.addEventListener('DOMContentLoaded', () => {
  console.log('NOKAT App loaded');
  loadPosts();
  // Автообновление каждые 10 сек
  setInterval(loadPosts, 10000);
});
</script>
</body>
</html>
